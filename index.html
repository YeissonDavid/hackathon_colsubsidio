<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORIGEN · Estación de Decisión — Hackathon Colsubsidio y 30X</title>
  <meta name="description" content="Copiloto de deliberación financiera para los analistas de crédito de Colsubsidio: decisiones explicables, auditables y centradas en el bienestar del afiliado.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">

  <!--
    Tipografía
    ----------
    Se cargan desde Google Fonts, pero TODA la pila declara alternativas del
    sistema en tokens.css. Sin conexión —y una demostración puede tocar hacerse
    sin wifi— la interfaz cae a la tipografía del sistema y sigue siendo
    legible. Ver docs/MEJORAS.md §4.3 para servirlas en local.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">

  <!--
    Hojas de estilo, en cascada deliberada
    -------------------------------------
    1 tokens      variables de marca y sistema, única fuente de color
    2 base        reset, tipografía del documento, foco, utilidades
    3 layout      armazón persistente: barra lateral, barra superior, contenido
    4 components  piezas reutilizables: botones, tarjetas, tablas, KPI
    5 views       anatomía de pantallas concretas: ficha, proyección, lote

    El orden importa: cada capa solo puede depender de las anteriores.
  -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/views.css">
</head>

<body>
  <div class="shell">

    <!-- Navegación principal -->
    <aside class="rail">
      <div class="brandbox">
        <img class="brandbox__logo" src="assets/brand/logo.png" alt="Colsubsidio">
        <div>
          <div class="brandbox__title">ORIGEN</div>
          <div class="brandbox__sub">COLSUBSIDIO</div>
        </div>
      </div>

      <nav class="navsec" aria-label="Operación">
        <div class="navsec__label">Operación</div>
        <button class="navitem" type="button" data-view="bandeja" aria-current="page">
          Bandeja de decisión
          <span class="navitem__count" id="nav-bandeja-count">—</span>
        </button>
        <button class="navitem" type="button" data-view="lote">Procesamiento por lote</button>
        <button class="navitem" type="button" data-view="portafolio">Portafolio y reglas</button>
      </nav>

      <nav class="navsec" aria-label="Gobierno del dato">
        <div class="navsec__label">Gobierno del dato</div>
        <button class="navitem" type="button" data-view="fuentes">Fuentes y consentimiento</button>
      </nav>

      <div class="railfoot">
        <div><span class="railfoot__dot"></span>Motor v5.0 · operativo</div>
        <div>Población sintética calibrada</div>
      </div>
    </aside>

    <div class="main">

      <!-- Barra superior: búsqueda y control de privacidad -->
      <div class="topbar">
        <div class="finder">
          <span class="finder__icon" aria-hidden="true">⌕</span>
          <label class="sr-only" for="finder">Buscar afiliado por cédula o nombre</label>
          <input class="finder__input" id="finder" type="search"
                 placeholder="Buscar por cédula o nombre…" autocomplete="off">
        </div>

        <div class="topbar__right">
          <span class="envtag">Demostración</span>
          <div class="who">
            <div class="who__avatar" aria-hidden="true">LM</div>
            <div>
              <div class="who__name">Laura Medina</div>
              <div class="who__role">
                Analista
                <label class="privacy-toggle" for="privacy-toggle">
                  <input type="checkbox" id="privacy-toggle" checked>
                  Ocultar PII
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Contenedor de vistas: lo pinta el enrutador -->
      <main class="content" id="content">
        <div class="pad" id="view"></div>

        <footer class="appfoot">
          <strong>Demo ORIGEN</strong><br>
          Hackathon de Colsubsidio y 30X<br>
          Jesus Ruiz y Yeisson Abril<br>
          Julio 2026
        </footer>
      </main>

    </div>
  </div>

  <!-- Aviso de confirmación. aria-live para que se anuncie sin robar el foco. -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="toast__title" id="toast-title"></div>
    <div class="toast__detail" id="toast-detail"></div>
  </div>

  <a class="floating-contact" href="https://wa.me/573196966226" target="_blank" rel="noopener noreferrer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
    Asesor de línea
  </a>

  <!--
    Scripts, en orden de dependencia
    -------------------------------
    Se cargan como scripts clásicos, no como módulos ES, porque `file://`
    bloquea los módulos por política de origen cruzado y el criterio de
    aceptación exige arrancar con doble clic. Cada archivo es una IIFE que
    publica su API en el objeto global ORIGEN; el orden de estas etiquetas ES
    el grafo de dependencias. Ver docs/ARCHITECTURE.md §6.

    Si añades un archivo, colócalo después de todo lo que consume.
  -->

  <!-- Núcleo: sin dependencias de dominio -->
  <script src="assets/js/core/namespace.js"></script>
  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/math.js"></script>
  <script src="assets/js/core/random.js"></script>
  <script src="assets/js/core/format.js"></script>
  <script src="assets/js/core/catalog.js"></script>

  <!-- Dominio: el motor de deliberación -->
  <script src="assets/js/domain/lifestage.js"></script>
  <script src="assets/js/domain/engagement.js"></script>
  <script src="assets/js/domain/population.js"></script>
  <script src="assets/js/domain/scoring.js"></script>
  <script src="assets/js/domain/capacity.js"></script>
  <script src="assets/js/domain/projection.js"></script>
  <script src="assets/js/domain/narrative.js"></script>
  <script src="assets/js/domain/decision.js"></script>
  <script src="assets/js/domain/dataset.js"></script>

  <!-- Presentación -->
  <script src="assets/js/ui/dom.js"></script>
  <script src="assets/js/ui/privacy.js"></script>
  <script src="assets/js/ui/toast.js"></script>
  <script src="assets/js/ui/charts.js"></script>
  <script src="assets/js/ui/blocks.js"></script>
  <script src="assets/js/ui/views/inbox.js"></script>
  <script src="assets/js/ui/views/affiliate.js"></script>
  <script src="assets/js/ui/views/batch.js"></script>
  <script src="assets/js/ui/views/portfolio.js"></script>
  <script src="assets/js/ui/views/sources.js"></script>
  <script src="assets/js/ui/router.js"></script>

  <!-- Arranque -->
  <script src="assets/js/main.js"></script>
</body>
</html>
