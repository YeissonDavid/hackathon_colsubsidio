const $=id=>document.getElementById(id); const view=$("view"); let currentView="bandeja",filter="todos",resolved={}; function toast(t,d,risk){  const el=$("toast");$("toast-t").textContent=t;el.querySelector("#toast-d").textContent=d;  el.classList.toggle("risk",!!risk);el.classList.add("on");  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),3400); } function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))} function projectionChart(d){  const W=760,H=250,PL=42,PR=58,PT=16,PB=28;  const iw=W-PL-PR,ih=H-PT-PB;  const yMin=0,yMax=100;  const x=m=>PL+(m/12)*iw, y=v=>PT+ih-((v-yMin)/(yMax-yMin))*ih;  const path=arr=>arr.map((v,m)=>(m?"L":"M")+x(m).toFixed(1)+","+y(v).toFixed(1)).join(" ");  const series=[    {k:"now",label:"Otorgar ahora",col:"var(--brass)",arr:d.pr.now,end:d.pr.endNow},    {k:"wait",label:"Esperar mejor momento",col:"var(--steel)",arr:d.pr.wait,end:d.pr.endWait},    {k:"route",label:"No otorgar · acompañar",col:"#C4564F",arr:d.pr.route,end:d.pr.endRoute}  ];  let grid="";  [0,25,50,75,100].forEach(v=>{grid+=`<line x1="${PL}" y1="${y(v)}" x2="${PL+iw}" y2="${y(v)}"/>`;});  let ylab="";  [0,25,50,75,100].forEach(v=>{ylab+=`<text x="${PL-9}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;});  let xlab="";  [0,3,6,9,12].forEach(m=>{xlab+=`<text x="${x(m)}" y="${PT+ih+18}" text-anchor="middle">${m===0?"hoy":"mes "+m}</text>`;});  let lines="",ends="";  series.forEach(s=>{    const win=d.winKey===s.k;    lines+=`<path class="serie${win?"":" dash"}" d="${path(s.arr)}" stroke="${s.col}" opacity="${win?1:.62}"/>`;    ends+=`<circle cx="${x(12)}" cy="${y(s.end)}" r="${win?4:3}" fill="${s.col}" opacity="${win?1:.7}"/>`;    ends+=`<text class="endlbl" x="${x(12)+9}" y="${y(s.end)+4}" fill="${s.col}" opacity="${win?1:.75}">${Math.round(s.end)}</text>`;  });  const legend=series.map(s=>{    const win=d.winKey===s.k;    return `<div class="clg${win?" win":""}"><span class="ln" style="background:${s.col};${win?"":"opacity:.6"}"></span>      <span class="lt">${s.label}</span><span class="lv">${Math.round(s.arr[0])} → ${Math.round(s.end)}</span></div>`;  }).join("");  const wname={now:"Otorgar ahora",wait:"Esperar",route:"No otorgar y acompañar"}[d.winKey];  const others=series.filter(s=>s.k!==d.winKey).map(s=>Math.round(s.end));  const winEnd=Math.round(series.find(s=>s.k===d.winKey).end);  const gap=winEnd-Math.max(...others);  let read;  if(d.winKey==="route")read=`<b>No otorgar y acompañar</b> deja al afiliado ${gap} puntos por encima de la mejor alternativa de crédito a doce meses. Otorgar hoy elevaría su carga y su probabilidad de mora.`;  else if(d.winKey==="wait")read=`<b>Esperar</b> supera por ${gap} puntos a otorgar hoy: al cerrarse una obligación se libera capacidad y el mismo objetivo se alcanza con una cuota más holgada.`;  else if(d.seq)read=`<b>Otorgar ahora en secuencia</b> — consumo primero — supera por ${gap} puntos a las demás rutas: ordenar la deuda costosa libera capacidad y hace sostenible el crédito siguiente.`;  else read=`<b>Otorgar ahora</b> supera por ${gap} puntos a las alternativas: la capacidad proyectada se sostiene durante los doce meses sin tensionar el hogar.`;  return `<div class="chart chartwrap">    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de bienestar financiero a doce meses">      <g class="grid">${grid}</g>      <line class="todayline" x1="${x(0)}" y1="${PT}" x2="${x(0)}" y2="${PT+ih}"/>      <g class="axis">${ylab}${xlab}        <text x="${PL-9}" y="${PT-4}" text-anchor="end" style="font-size:9px">índice</text>      </g>      ${lines}${ends}    </svg>  </div>  <div class="chartlegend">${legend}</div>  <div class="readout">${read}</div>`; } function capacityBlock(d){  const ing=d.a.ingreso, comp=d.compromiso;  const isRoute=d.verdict==="no_viable";  const cuota=isRoute?0:d.cuota;  const pc=v=>Math.max(0,v/ing*100);  const et=ETAPAS[d.a.etapa];  const reqMonths=d.a.contrato==="indefinido"?2:6;  const okVinc=d.a.antig>=reqMonths;  const okCarga=d.cargaFinal<=et.cuota+0.001;  const topeLib=Math.min(d.a.ingreso*3,1.5e6*Math.max(1,Math.round(d.a.ingreso/SMMLV)));  const compQueda=d.sustituye?Math.max(0,comp-d.pagoExterno):comp;  const libreHoy=Math.max(0,ing-comp);  const libreDesp=Math.max(0,ing-compQueda-cuota);  const barra=(segs)=>`<div class="allocbar">${segs.map(s=>`<i class="${s.c}" style="width:${pc(s.v).toFixed(1)}%" title="${s.t}"></i>`).join("")}</div>`;  const hoy=barra([    d.sustituye?{c:"a4",v:d.pagoExterno,t:"Deuda externa costosa"}:null,    {c:"a1",v:d.sustituye?comp-d.pagoExterno:comp,t:"Obligaciones"},    {c:"a3",v:libreHoy,t:"Disponible"}  ].filter(Boolean));  const desp=isRoute?"":barra([    {c:"a1",v:compQueda,t:"Obligaciones que continúan"},    {c:"a2",v:cuota,t:"Cuota de la resolución"},    {c:"a3",v:libreDesp,t:"Disponible"}  ]);  return `  <div class="alloc">    <div class="allocrow"><span class="alab">Hoy</span>${hoy}</div>    ${isRoute?"":`<div class="allocrow"><span class="alab on">Con la resolución</span>${desp}</div>`}    <div class="alloclegend">      ${d.sustituye?`<div class="alegend"><span class="sw" style="background:#C4564F"></span>Deuda externa al ${d.a.extDeb.tasa}% <b>${fmt(d.pagoExterno)}/mes</b></div>`:""}      <div class="alegend"><span class="sw" style="background:#44526A"></span>Obligaciones <b>${fmt(compQueda)}</b></div>      ${isRoute?"":`<div class="alegend"><span class="sw" style="background:var(--brass)"></span>Cuota de la resolución <b>${fmt(cuota)}</b></div>`}      <div class="alegend"><span class="sw" style="background:var(--surf3)"></span>Disponible <b>${fmt(isRoute?libreHoy:libreDesp)}</b></div>    </div>    ${d.sustituye&&d.liberacion>0?`<div class="liber">La resolución <b>sustituye</b> la obligación externa en lugar de sumarse a ella: libera <b>${fmt(d.liberacion)}</b> de flujo mensual.</div>`:""}    <div class="policy">      <div class="pcheck"><span class="ck${okCarga?"":" no"}">${okCarga?"✓":"✕"}</span>Carga final <b>${(d.cargaFinal*100).toFixed(1)}%</b> · tope del momento de vida ${(et.cuota*100).toFixed(0)}%</div>      <div class="pcheck"><span class="ck${okVinc?"":" no"}">${okVinc?"✓":"✕"}</span>Vinculación <b>${d.a.antig} meses</b> · mínimo ${reqMonths}</div>      <div class="pcheck"><span class="ck">✓</span>Modalidad <b>${d.modalidad}</b> · Ley 1527 de 2012</div>      <div class="pcheck"><span class="ck">✓</span>Tope por capacidad <b>${fmt(topeLib)}</b></div>    </div>  </div>`; } function deliberationBlock(d){  const max=Math.max(1,d.ranked[0].sum);  const rows=d.ranked.map((p,i)=>{    const top=i===0;    const segs=p.parts.map(pt=>`<i style="width:${(pt.pts/max*100).toFixed(1)}%;background:${SIGCOL[pt.label]||"#6E7C93"};opacity:${top?1:.5}"></i>`).join("");    return `<div class="dlrow${top?" top":""}">      <div class="dn2">${PROD[p.prod].n}</div>      <div class="dltrack">${segs}</div>      <div class="ds">${p.sum}</div></div>`;  }).join("");  const win=d.ranked[0];  const contrib=win.parts.map(pt=>`<div class="crow"><span class="csw" style="background: ${SIGCOL[pt.label]||"#6E7C93"}"></span>    <span class="cl">${pt.label}</span><span class="cv">+${pt.pts}</span></div>`).join("");  return `${`<div class="delib">${rows}</div>`}  <div class="contrib">    <div class="ch">Composición del puntaje · ${PROD[win.prod].n}</div>    ${contrib}    <div class="crow tot"><span class="cl">Puntaje de ajuste al perfil</span><span class="cv">${win.sum}</span></div>  </div>`; } function franjaBlock(d){  const hours=[];for(let h=6;h<=23;h++)hours.push(h);  let html='<div class="heat"><div></div>';  hours.forEach(h=>{html+=`<div class="hh">${h%3===0?h:""}</div>`;});  d.a.franja.forEach((row,di)=>{    html+=`<div class="hd">${DIAS[di]}</div>`;    row.forEach((v,hi)=>{      const peak=(di===d.peakD&&hi+6>=d.peakH&&hi+6<d.peakH+2);      const alpha=(0.06+v*0.9).toFixed(2);      html+=`<div class="hc${peak?" peak":""}" style="background:rgba(255,208,0,${alpha})" title="${DIAS[di]} ${hi+6}:00"></div>`;    });  });  html+="</div>";  return html+`<div class="heatfoot">    <div>Ventana de mayor conexión: <b style="color:var(--brass)">${d.franjaLbl}</b></div>    <div class="heatscale"><span>baja</span>      ${[0.1,0.3,0.55,0.8,1].map(v=>`<span class="hs" style="background:rgba(255,208,0,${(0.06+v*0.9).toFixed(2)})"></span>`).join("")}      <span>alta</span></div>  </div>`; } function countBy(fn){return DEC.filter(fn).length} function renderBandeja(){  const counts={    todos:DEC.length,    viable:countBy(d=>d.verdict==="viable"),    viable_condiciones:countBy(d=>d.verdict==="viable_condiciones"),    mejor_momento:countBy(d=>d.verdict==="mejor_momento"),    no_viable:countBy(d=>d.verdict==="no_viable")  };  const avgConf=Math.round(DEC.reduce((s,d)=>s+d.conf,0)/DEC.length*100);  const list=DEC.filter(d=>filter==="todos"?true:d.verdict===filter);  const rows=list.slice(0,60).map(d=>{    const [cls,lbl]=VLABEL[d.verdict];    const done=resolved[d.idx];    return `<tr data-i="${d.idx}" tabindex="0" class="row">      <td><div class="cell-name">${esc(maskName(d.a.nombre))}</div><div class="cell-sub">${maskId(d.a.id)}</div></td>      <td class="num">${d.a.cat}</td>      <td><span class="tagm">${ETAPAS[d.a.etapa].n}</span></td>      <td>${d.verdict==="no_viable"?"—":PROD[d.prod].n}</td>      <td class="r num">${d.verdict==="no_viable"?"—":fmt(d.monto)}</td>      <td><span class="pill ${cls}">${done?"Resuelto · ":""}${lbl}</span></td>      <td class="r"><div class="conf"><div class="confbar"><i style="width:${Math.round(d.conf*100)}%"></i></div><span class="num">${Math.round(d.conf*100)}%</span></div></td>    </tr>`;  }).join("");  view.innerHTML=`  <div class="phead">    <div><h1>Bandeja de decisión</h1><div class="psub">Afiliados enriquecidos y deliberados, pendientes de resolución.</div></div>    <div class="pact"><button class="btn sm" id="exp">Exportar</button><button class="btn primary sm" data-goto="lote">Procesar lote</button></div>  </div>  <div class="kpis">    <div class="kpi"><div class="kl">En bandeja</div><div class="kv">${DEC.length}</div><div class="kd">enriquecidos hoy</div></div>    <div class="kpi ok"><div class="kl">Viables</div><div class="kv">${counts.viable+counts.viable_condiciones}</div><div class="kd">${counts.viable_condiciones} con condiciones</div></div>    <div class="kpi acc"><div class="kl">Mejor momento</div><div class="kv">${counts.mejor_momento}</div><div class="kd">reprogramados</div></div>    <div class="kpi risk"><div class="kl">Ruta de bienestar</div><div class="kv">${counts.no_viable}</div><div class="kd">protección activa</div></div>    <div class="kpi"><div class="kl">Confianza media</div><div class="kv">${avgConf}%</div><div class="kd">del motor</div></div>  </div>  <div class="filters">    ${[["todos","Todos"],["viable","Viables"],["viable_condiciones","Con condiciones"], ["mejor_momento","Mejor momento"],["no_viable","Ruta de bienestar"]]      .map(f=>`<button class="fchip${filter===f[0]?" on":""}" data-f="${f[0]}">${f[1]}<span class="n">${counts[f[0]]}</span></button>`).join("")}  </div>  <div class="tablewrap">    <table>      <thead><tr>        <th>Afiliado</th><th>Cat.</th><th>Momento de vida</th><th>Decisión sugerida</th>        <th class="r">Monto</th><th>Estado</th><th class="r">Confianza</th>      </tr></thead>      <tbody>${rows}</tbody>    </table>    <div class="tfoot"><span>Mostrando ${Math.min(60,list.length)} de ${list.length}</span><span>Orden: prioridad del motor</span></div>  </div>`;  view.querySelectorAll(".fchip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderBandeja();});  view.querySelectorAll("tbody tr").forEach(tr=>{    tr.onclick=()=>openFicha(+tr.dataset.i);    tr.onkeydown=e=>{if(e.key==="Enter")openFicha(+tr.dataset.i);};  });  const exp=$("exp"); if(exp)exp.onclick=()=>toast("Exportación generada","Bandeja completa en CSV, con trazabilidad de fuentes por afiliado.");  const g=view.querySelector('[data-goto="lote"]'); if(g)g.onclick=()=>go("lote"); } function openFicha(i){  const d=DEC[i];  currentView="ficha";  setNav(null);  const [cls,lbl]=VLABEL[d.verdict];  const isRoute=d.verdict==="no_viable";  const a=d.a;  const exo=[    ["Correo verificado",a.correo,"Verificación documental","Ley 1581 de 2012 · consentimiento de canal",false],    ["Obligaciones con otras entidades",a.extDeb.n>0?`${a.extDeb.n} · ${fmt(a.extDeb.saldo)} · ${a.extDeb.tasa}% E.A.`:"Sin obligaciones externas","Centrales de información","Ley 1266 de 2008 · autorización del titular",a.extDeb.n>0],    ["Ingresos no bancarizados",a.ingNoBanc>0?`${a.ingNoBanc} meses con regularidad`:"No aplica","Data alternativa de pagos","Autorización del titular",false],    ["Actividad económica registrada",a.rues?"Registrada en RUES":"No registrada","Registros públicos","Dato público",false],    ["Ventana de conexión",d.franjaLbl,"Actividad digital del afiliado","Relación de afiliación",false]  ];  view.innerHTML=`  <button class="backlink" id="back">← Bandeja de decisión</button>  <div class="subject">    <div class="sav">${esc(a.nombre.split(" ")[0][0])}${esc(a.nombre.split(" ")[1][0])}</div>    <div>      <div class="sname">${esc(a.nombre)}</div>      <div class="smeta">${a.id} · ${a.edad} años · Categoría ${a.cat} · ${a.contrato}</div>    </div>    <div class="sright">      <div class="sstat"><div class="sl">Ingreso</div><div class="sv">${fmt(a.ingreso)}</div></div>      <div class="sstat"><div class="sl">Vinculación</div><div class="sv">${a.antig} m</div></div>      <div class="sstat"><div class="sl">Hogar</div><div class="sv">${a.hijos} hijo(s)</div></div>      <div class="sstat"><div class="sl">Momento de vida</div><div class="sv" style="color:var(--violet);font-size:13.5px">${ETAPAS[a.etapa].n}</div></div>      <span class="pill ${cls}" style="font-size:12px;padding:5px 11px">${lbl}</span>    </div>  </div>  <div class="fichagrid">    <div>      <div class="card">        <div class="card-h"><h3>Enriquecimiento exógeno</h3><span class="hn">Fuente y base jurídica</span></div>        <div class="card-b">          <table class="srctable">            <thead><tr><th style="width:34%">Variable</th><th style="width:26%">Valor</th><th style="width:20%">Fuente</th><th>Base jurídica</th></tr></thead>            <tbody>              ${exo.map(e=>`<tr>                <td>${e[0]}</td>                <td class="sv2 ${e[4]?"flagv":""}">${e[1]}</td>                <td class="leg">${e[2]}</td>                <td class="leg">${e[3]}</td></tr>`).join("")}            </tbody>          </table>        </div>      </div>      <div class="card">        <div class="card-h"><h3>Capacidad de pago y cumplimiento de política</h3><span class="hn">Ingreso mensual ${fmt(a.ingreso)}</span></div>        <div class="card-b">${capacityBlock(d)}</div>      </div>      <div class="card">        <div class="card-h"><h3>Deliberación del portafolio</h3><span class="hn">7 productos evaluados</span></div>        <div class="card-b">${deliberationBlock(d)}</div>      </div>      <div class="card">        <div class="card-h"><h3>Proyección de bienestar financiero</h3><span class="hn">12 meses · 3 escenarios</span></div>        <div class="card-b">${projectionChart(d)}</div>      </div>      <div class="card">        <div class="card-h"><h3>Ventana de contacto</h3><span class="hn">Actividad digital · 7 días × 18 horas</span></div>        <div class="card-b">${franjaBlock(d)}</div>      </div>    </div>    <div class="rail2">      <div class="resolution">        <div class="res-h">          <div class="rt">${isRoute?"Ruta de bienestar":"Resolución de crédito"}</div>          <div class="rn">ORIGEN · ${a.id}</div>        </div>        <div class="res-b">          ${isRoute?`            <div class="resrow"><div class="rk2">Determinación</div><div class="rv2">Sin desembolso hoy</div>              <div class="rw2">Educación financiera y ahorro programado.</div></div>            <div class="resrow"><div class="rk2">Recalificación</div><div class="rv2">6 meses</div>              <div class="rw2">Automática, sin nueva solicitud del afiliado.</div></div>            <div class="resrow"><div class="rk2">Contacto</div><div class="rv2">${d.canal}</div>              <div class="rw2">Con fecha cierta de retorno.</div></div>          `:`            <div class="resrow"><div class="rk2">Producto</div><div class="rv2">${d.seq?"Compra de cartera → Crédito Mujeres":PROD[d.prod].n}</div>              <div class="rw2">${d.extra||""}</div></div>            <div class="resrow"><div class="rk2">Monto</div><div class="rv2">${fmt(d.monto)}</div></div>            <div class="resrow"><div class="rk2">Cuota / plazo</div><div class="rv2">${fmt(d.cuota)} · ${d.plazo>60?Math.round(d.plazo/12)+" años":d.plazo+" meses"}</div>              <div class="rw2">Modalidad ${d.modalidad}.</div></div>            
            <div class="resrow"><div class="rk2">Entrega</div><div class="rv2">${d.canal}</div>
              <div class="rw2">${d.franjaLbl}</div>

          `}        </div>        <div class="reasonbox">“${d.reason}”</div>        <div class="confblock">          <div class="cl2"><span>Confianza del motor</span><span>${Math.round(d.conf*100)} %</span></div>          <div class="cbar"><i style="width:${Math.round(d.conf*100)}%"></i></div>        </div>        <div class="resactions">          ${isRoute?`            <button class="btn risk" data-act="ruta">Activar ruta de bienestar</button>            <button class="btn" data-act="asesor">Asignar a asesor</button>          `:`            <button class="btn ok" data-act="aprobar">Aprobar resolución</button>            <button class="btn" data-act="ajustar">Ajustar condiciones</button>            <button class="btn" data-act="ruta">Enviar a ruta de bienestar</button>          `}          <div class="resnote">Toda resolución queda registrada con sus variables, fuentes y base jurídica.</div>        </div>      </div>    </div>  </div>`;  $("back").onclick=()=>go("bandeja");  view.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{    const act=b.dataset.act;    resolved[i]=act;    if(act==="aprobar")toast("Resolución aprobada",`${PROD[d.prod].n} por ${fmt(d.monto)} · notificación programada para ${d.franjaLbl}.`);    else if(act==="ajustar")toast("Condiciones en ajuste","Se abrió una revisión manual con la trazabilidad del motor adjunta.");    else if(act==="asesor")toast("Asignado a asesor","Contacto humano con fecha cierta de retorno.",true);    else toast("Ruta de bienestar activada","Sin desembolso hoy · recalificación automática en 6 meses.",true);  });  view.querySelectorAll(".dltrack i").forEach(el=>{const w=el.style.width;el.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.width=w));});  view.scrollIntoView({block:"start"}); } function renderLote(){
  const vd={}; const vm={}; DEC.forEach(d=>{ vd[d.verdict]=(vd[d.verdict]||0)+1; vm[d.verdict]=(vm[d.verdict]||0)+(d.monto||0); });

  const maxP=Math.max(1,...Object.values(pd)),maxM=Math.max(1,...Object.values(md));
  const dist=(label,val,total,col,extra="")=>`<div class="distrow"><div class="dl2">${label}</div><div class="disttrack"><i data-w="${(val/total*100).toFixed(1)}" style="background:${col}"></i></div><div class="dv2">${val}<span> ${(val/DEC.length*100).toFixed(0)}%</span><br>${extra}</div></div>`;
